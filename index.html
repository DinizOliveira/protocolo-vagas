<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Protocolo de acesso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{--paper:#EDF2EF;--surface:#F9FBFA;--ink:#13302C;--muted:#56706A;--line:#C6D5CF;--blue:#2F5FD0;--blue-soft:#DCE5FA;--yellow:#DDA82A;--err:#A3361B;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0F1D1B;--surface:#152724;--ink:#E3ECE8;--muted:#9DB1AC;--line:#2C433E;--blue:#7C9DF2;--blue-soft:#1C2C4D;--yellow:#E8C15A;--err:#F0957A;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0F1D1B;--surface:#152724;--ink:#E3ECE8;--muted:#9DB1AC;--line:#2C433E;--blue:#7C9DF2;--blue-soft:#1C2C4D;--yellow:#E8C15A;--err:#F0957A;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.55;display:grid;place-items:center}
main{width:100%;max-width:520px;padding:32px 20px}
.well{width:44px;height:44px;border-radius:50%;border:2px solid var(--blue);background:var(--blue-soft);margin-bottom:28px;transition:background .5s ease,border-color .5s ease}
.well.ok{background:var(--yellow);border-color:var(--yellow)}
h1{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:clamp(2.2rem,8vw,3rem);line-height:1.15;margin:0 0 18px}
.q{font-size:1.15rem;margin:0 0 18px}
input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:.75rem .9rem}
input:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.remember{display:flex;gap:8px;align-items:center;margin:12px 0 22px;color:var(--muted);font-size:.95rem}
.remember input{accent-color:var(--blue);width:18px;height:18px}
button{font:600 1rem/1 "Figtree",system-ui,sans-serif;cursor:pointer;border-radius:999px;padding:.9rem 1.6rem;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper)}
button[disabled]{opacity:.6;cursor:progress}
.msg{min-height:1.5em;margin-top:16px;color:var(--err);font-weight:500}
.msg.info{color:var(--muted);font-weight:400}
.sign{margin-top:40px;font-size:.9rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="well" id="well" aria-hidden="true"></div>
  <h1>Antes, uma pergunta.</h1>
  <form id="f" autocomplete="off">
    <label class="q" for="ans">Se sua mãe tivesse escolhido a outra opção do seu pai, como cê se chamaria?</label>
    <input type="text" id="ans" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <label class="remember"><input type="checkbox" id="rem" checked> Lembrar neste aparelho</label>
    <button type="submit" id="go">Abrir</button>
    <p class="msg" id="msg" aria-live="polite"></p>
  </form>
  <p class="sign">Supervisão técnica: Floquita, Luna e Berinjela.</p>
</main>

  var STORE="isadora-chave-v1";
  var fails=0;
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function tob64(buf){var u=new Uint8Array(buf),s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
  function norm(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();}
  var msg=document.getElementById("msg");
  if(!(window.crypto&&crypto.subtle)){msg.textContent="Esse navegador não consegue abrir a página. Tenta pelo Chrome ou Safari atualizados.";return;}

  async function derive(pass){
    var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(norm(pass)),"PBKDF2",false,["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
  }
  async function open(key){
    var plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(DATA));
    return new TextDecoder().decode(plain);
  }
  function show(html){
    document.getElementById("well").classList.add("ok");
    setTimeout(function(){document.open();document.write(html);document.close();},350);
  }
  async function tryStored(){
    try{
      var raw=localStorage.getItem(STORE); if(!raw) return;
      var key=await crypto.subtle.importKey("raw",b64(raw),{name:"AES-GCM"},false,["decrypt"]);
      show(await open(key));
    }catch(e){ try{localStorage.removeItem(STORE);}catch(_){} }
  }
  document.getElementById("f").addEventListener("submit",async function(e){
    e.preventDefault();
    var btn=document.getElementById("go"), v=document.getElementById("ans").value;
    if(!v.trim()) return;
    btn.disabled=true; msg.className="msg info"; msg.textContent="Conferindo…";
    try{
      var key=await derive(v);
      var html=await open(key);
      if(document.getElementById("rem").checked){ try{localStorage.setItem(STORE,tob64(await crypto.subtle.exportKey("raw",key)));}catch(_){} }
      msg.textContent=""; show(html);
    }catch(err){
      fails++; btn.disabled=false; msg.className="msg";
      msg.textContent = (fails>=2 && HINT) ? "Ainda não. Dica: "+HINT : "Hmm, não é isso. Tenta de novo.";
      document.getElementById("ans").select();
    }
  });
  tryStored();
